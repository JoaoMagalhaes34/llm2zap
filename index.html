<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>A redirecionar para o WhatsApp...</title>
</head>
<body>
    <p>A processar a ligação...</p>
    <script>
        // Capta a informação quer venha por ? (search) ou por # (hash)
        let query = window.location.search;
        if (!query) {
            query = window.location.hash;
        }
        
        // Remove o símbolo inicial (? ou #) para processar o texto limpo
        if (query.startsWith('?') || query.startsWith('#')) {
            query = query.substring(1);
        }

        const parametros = new URLSearchParams(query);
        const numero = parametros.get('num');
        const mensagem = parametros.get('msg');

        if (numero) {
            document.body.innerHTML = "<p>A abrir o WhatsApp...</p>";
            let linkFinal = "https://wa.me/" + numero;
            if (mensagem) {
                linkFinal += "?text=" + encodeURIComponent(mensagem);
            }
            window.location.href = linkFinal;
        } else {
            // Se falhar, mostra exatamente o que chegou ao site para podermos corrigir
            document.body.innerHTML = "<p><strong>Erro: Número não encontrado.</strong></p><p>O site recebeu este endereço: <br>" + window.location.href + "</p>";
        }
    </script>
</body>
</html>
