<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>A redirecionar para o WhatsApp...</title>
</head>
<body>
    <p>A abrir o WhatsApp...</p>
    <script>
        // A MAGIA ACONTECE AQUI: Lemos o hash (#) em vez do search (?)
        const parametros = new URLSearchParams(window.location.hash.substring(1));
        const numero = parametros.get('num');
        const mensagem = parametros.get('msg');

        // Se o número existir, monta a ligação do WhatsApp e redireciona
        if (numero) {
            let linkFinal = "https://wa.me/" + numero;
            if (mensagem) {
                // Codifica a mensagem corretamente para o WhatsApp
                linkFinal += "?text=" + encodeURIComponent(mensagem);
            }
            // Executa o redirecionamento instantâneo
            window.location.href = linkFinal;
        } else {
            document.body.innerHTML = "<p>Erro: Número não fornecido.</p>";
        }
    </script>
</body>
</html>
